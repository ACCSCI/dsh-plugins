name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # One entry point: the toolbox discovers every plugin, checks manifests,
      # README and CI wiring, then runs every dependency-free suite it finds.
      - name: repository check
        run: node tools/dsh-plugins.mjs check
